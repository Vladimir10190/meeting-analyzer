<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI-анализатор видеовстреч</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>AI-анализатор видеовстреч</h1>
      <p>Расшифровка и конспект из записи встречи.</p>
    </header>
    <section class="upload" aria-labelledby="upload-title">
      <div>
        <h2 id="upload-title">Загрузить видео</h2>
        <p>MP4 или WebM · 2–5 минут · до 250 МиБ</p>
      </div>
      <button type="button" id="choose" disabled>Выбрать файл</button>
      <input type="file" id="file" accept=".mp4,.webm,video/mp4,video/webm" hidden>
      <p class="privacy">Для обработки видео и расшифровка передаются выбранному AI-провайдеру.</p>
      <p id="status" role="status" hidden></p>
      <p id="request-error" role="alert" hidden></p>
    </section>
    <div class="workspace">
      <section class="history" aria-labelledby="history-title">
        <h2 id="history-title">История встреч</h2>
        <p id="empty">Загружаем историю…</p>
        <ul id="meetings"></ul>
      </section>
      <section id="detail" class="detail" aria-label="Выбранная встреча" hidden></section>
    </div>
  </main>
</body>
</html>
